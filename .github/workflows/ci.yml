name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate example checklists parse
        run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('examples/*.json')]; print('examples ok')"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke run
        run: python fieldverify.py init --out smoke.json && python fieldverify.py --help
























